<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the player!</title>
    <link rel="stylesheet" href="./styleContact.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" type="x-icon" href="image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Bartle&family=BBH+Sans+Bogle&family=BBH+Sans+Hegarty&family=Bungee&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="contactSystem">
        <!-- HEADER -->
      <div class="header">
          <div class="navbar">
              <ul>
                  <li><a href="HomePage.html">HOME</a></li>
                  <li><a href="Guess.html">PLAY!</a></li>
                  <li><a href="Contact.html">CONTACT</a></li>
              </ul>
          </div>
          <div class="title-section">
              <div class="hometitle">GUESS THE PLAYER</div> 
              <div class="undertext">BEST QUIZZES ABOUT FOOTBALL!</div>
          </div>
          <hr>
      </div>
      <!-- SHEET -->
      <div class="sheet">
        <div class="upperSheet">
          <img src="4.png" alt="obrazek4">
          <div class="desc">
              WE SEE YOU GOT SUGGESTIONS FOR US<br>
              MAYBE IT IS A NEW QUIZ OR <br>
              REPORTING THE ERRORS<br>
              SEND YOUR IDEA AND HELP US <br>TO MAKE OUR SITE BETTER
          </div >
        </div>
        <hr>
        <div class="personalSheet"> 
          <div class="checkboxes">
            <input type="checkbox"> 
            <label class="chlabel">NEW QUIZ</label> 
            <input type="checkbox"> 
            <label class="chlabel">ERROR</label> 
          </div>
          <div class="nameemail">
            <input class="namebox" type="text" id="namebox" placeholder="Name">
            <input class="namebox"type="text" id="emailbox" placeholder="E-mail" >
          </div>
          <div class="descArea">
            <textarea class="sheetdesc" id="message" name="message" rows="5" cols="40" placeholder="Describe your suggestion..."></textarea>
            <button class="submitButton" onclick=clean()>Submit</button>
          </div>
        </div>
      </div>
      <!-- FOOTER -->
      <div class="footer">
            <p>made by Michal Koscianek</p>
            <p>aka KosteckHD :D, enjoy</p>
      </div>
      <script src="contact.js"></script>
    </div>
  </body>
</html>
